name: Security Scan & Supply Chain SBOM (Snyk & GLBA Compliance)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly every Monday at 06:00 UTC to catch newly disclosed CVEs
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  snyk-dependency-scan:
    name: Snyk Vulnerability & Dependency Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Native Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Security Vulnerability Scan
        run: snyk test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Generate CycloneDX 1.5 Software Bill of Materials (SBOM)
        run: node scripts/generateSbom.cjs

      - name: Upload SBOM Compliance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-glba-compliance
          path: sbom-cyclonedx.json
          retention-days: 90
