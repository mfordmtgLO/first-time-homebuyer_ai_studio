steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/fthb-enterprise:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/fthb-enterprise:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fthb-enterprise:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fthb-enterprise:latest']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fthb-enterprise'
      - '--image=gcr.io/$PROJECT_ID/fthb-enterprise:latest'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
images:
  - 'gcr.io/$PROJECT_ID/fthb-enterprise:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/fthb-enterprise:latest'
options:
  logging: CLOUD_LOGGING_ONLY
