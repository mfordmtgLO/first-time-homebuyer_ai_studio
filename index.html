<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.process = window.process || { env: {} };
      window.global = window.global || window;
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Anti-Indexing & Anti-Scraping Directives -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>GrantMatch Homebuyer</title>
    <meta name="description" content="Find local down payment grants, calculate your mortgage, and get pre-approved for your first home." />
    <meta name="theme-color" content="#E2DFD2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GrantMatch" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <meta property="og:title" content="GrantMatch Homebuyer" />
    <meta property="og:description" content="Find local down payment grants, calculate your mortgage, and get pre-approved for your first home." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Identity Services (GSI) for Google Workspace OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#F9F8F4] dark:bg-slate-950 text-[#2D362E] dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="root">
      <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F9F8F4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px;">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: #2D362E; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(45,54,46,0.15);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div style="width: 24px; height: 24px; border: 2.5px solid #EAE7E0; border-top-color: #4A5D4E; border-radius: 50%; animation: gm-spin 0.8s linear infinite; margin-bottom: 12px;"></div>
        <p style="color: #606C5D; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; margin: 0;">Loading Platform...</p>
        <div id="app-reload-prompt" style="display: none; margin-top: 18px; text-align: center;">
          <button onclick="window.location.reload(true)" style="background: #4A5D4E; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">Refresh Page</button>
        </div>
      </div>
      <style>
        @keyframes gm-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var prompt = document.getElementById('app-reload-prompt');
          if (prompt && document.getElementById('app-preloader')) {
            prompt.style.display = 'block';
          }
        }, 6000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
